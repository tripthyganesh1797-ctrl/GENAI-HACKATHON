name: CI

# Runs on every push and PR. Everything here runs against the offline,
# zero-API-key fallback path (no secrets required) -- exactly what a judge
# gets by cloning this repo and running `pip install -r requirements.txt`
# with no LLM_API_KEY configured, so a green check here is a direct,
# reproducible signal about the state of the submission.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (86 tests, ~90% coverage)
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  eval:
    name: Eval harness + ablation study (real official data)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval harness against the 20 official SIIS queries
        run: python eval/eval_harness.py

      - name: Run the 3-variant deeplink-matching ablation
        run: python eval/run_ablation.py

      - name: Upload generated metrics + ablation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-outputs
          path: |
            eval/metrics.md
            eval/ablation_results.json

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image (offline mode, no LLM key needed)
        run: docker build -t troubleshoot-engine:ci .
