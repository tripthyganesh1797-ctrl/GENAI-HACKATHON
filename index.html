<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Diagnostics — Smart Guided Troubleshooting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          void: '#0A0E17',
          surface: '#10151F',
          surface2: '#161C2A',
          line: '#212838',
          ink: '#E7ECF5',
          inkdim: '#8890A3',
          cyan: '#4CE0D2',
          amber: '#FFB454',
          red: '#FF5C6C',
          violet: '#8B7CFF',
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
          body: ['Inter', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(220%); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .cursor-blink { animation: blink 1s step-end infinite; }
  .scan-line { animation: scan 1.6s linear infinite; }
  .fade-up { animation: fadeUp 0.3s ease both; }
  @media (prefers-reduced-motion: reduce) {
    .cursor-blink, .scan-line, .fade-up { animation: none; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0A0E17; }
  ::-webkit-scrollbar-thumb { background: #212838; border-radius: 4px; }
  .grid-bg {
    background-image: linear-gradient(#151b28 1px, transparent 1px), linear-gradient(90deg, #151b28 1px, transparent 1px);
    background-size: 32px 32px;
  }
</style>
</head>
<body class="bg-void text-ink font-body min-h-screen grid-bg">

<div class="max-w-7xl mx-auto px-5 py-6 lg:px-8 lg:py-8">

  <!-- HEADER -->
  <header class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-violet/15 border border-violet/40 flex items-center justify-center">
        <span class="w-2.5 h-2.5 rounded-full bg-violet"></span>
      </div>
      <div>
        <h1 class="font-display font-bold text-lg text-white leading-tight">Galaxy Diagnostics</h1>
        <p class="text-inkdim text-xs font-mono">smart guided troubleshooting engine</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div class="hidden sm:flex items-center gap-1.5 border border-line rounded-full px-3 py-1.5">
        <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-cyan"></span>
        <span id="apiStatusText" class="text-xs font-mono text-cyan">ONLINE</span>
      </div>
      <button id="telemetryToggle" class="text-xs font-mono border border-line hover:border-violet/60 text-inkdim hover:text-ink px-3 py-1.5 rounded-full transition-colors duration-150">
        telemetry ▾
      </button>
    </div>
  </header>

  <div class="grid lg:grid-cols-[340px_1fr] gap-5">

    <!-- LEFT: DIAGNOSTIC CONSOLE -->
    <aside class="bg-surface border border-line rounded-2xl p-5 h-fit lg:sticky lg:top-6">
      <div class="flex items-center gap-2 mb-4">
        <span class="w-2 h-2 rounded-full bg-red/70"></span>
        <span class="w-2 h-2 rounded-full bg-amber/70"></span>
        <span class="w-2 h-2 rounded-full bg-cyan/70"></span>
        <span class="text-inkdim text-[11px] font-mono ml-1">diagnostic_input.sh</span>
      </div>

      <div class="flex items-center justify-between mb-2">
        <label class="block text-inkdim text-xs font-mono">$ describe_complaint</label>
        <select id="langSelect" title="Speech + query language"
          class="bg-void border border-line rounded text-[10px] font-mono text-inkdim px-1.5 py-1 focus:outline-none focus:border-violet/60">
          <option value="en-US">EN</option>
          <option value="en-IN">EN-IN</option>
          <option value="hi-IN">HI</option>
          <option value="es-ES">ES</option>
          <option value="fr-FR">FR</option>
        </select>
      </div>
      <div class="relative">
        <textarea id="complaintInput" rows="3"
          placeholder="my camera app crashes and battery dies fast"
          class="w-full bg-void border border-line rounded-lg px-3 py-2.5 pr-11 text-sm text-ink placeholder-inkdim/50 font-mono focus:outline-none focus:border-violet/60 focus:ring-1 focus:ring-violet/40 resize-none transition-colors duration-150"></textarea>
        <button id="micBtn" type="button" title="Speak your complaint"
          class="absolute right-2 top-2 w-7 h-7 rounded-md border border-line hover:border-cyan/60 flex items-center justify-center text-inkdim hover:text-cyan transition-colors duration-150">
          <svg id="micIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>
      <p id="micStatus" class="text-[10px] font-mono text-inkdim mt-1 h-3"></p>

      <button id="diagnoseBtn"
        class="w-full mt-3 bg-violet hover:bg-violet/85 text-white font-display font-semibold text-sm py-2.5 rounded-lg transition-colors duration-150 flex items-center justify-center gap-2">
        <span>Run Diagnosis</span>
        <span class="cursor-blink">▮</span>
      </button>

      <div class="mt-5 pt-4 border-t border-line">
        <p class="text-inkdim text-[11px] font-mono mb-2.5">quick_tests —</p>
        <div class="space-y-1.5">
          <button class="preset-btn w-full text-left text-xs font-mono text-inkdim hover:text-cyan border border-line hover:border-cyan/40 rounded-md px-3 py-2 transition-colors duration-150" data-q="camera app keeps crashing">
            → camera_crash
          </button>
          <button class="preset-btn w-full text-left text-xs font-mono text-inkdim hover:text-cyan border border-line hover:border-cyan/40 rounded-md px-3 py-2 transition-colors duration-150" data-q="display flickers and touch gestures not working">
            → display_gesture_fault
          </button>
          <button class="preset-btn w-full text-left text-xs font-mono text-inkdim hover:text-cyan border border-line hover:border-cyan/40 rounded-md px-3 py-2 transition-colors duration-150" data-q="phone bahuth garam ho rha hai restart ke baad bhi">
            → thermal_hinglish
          </button>
          <button class="preset-btn w-full text-left text-xs font-mono text-inkdim hover:text-cyan border border-line hover:border-cyan/40 rounded-md px-3 py-2 transition-colors duration-150" data-q="battery drains fast and camera lags on open">
            → multi_issue_battery_camera
          </button>
          <button class="preset-btn w-full text-left text-xs font-mono text-inkdim hover:text-amber hover:border-amber/40 border border-line rounded-md px-3 py-2 transition-colors duration-150" data-q="how to cook pasta at home">
            → out_of_scope_fallback
          </button>
        </div>
        <button id="batchDemoBtn"
          class="w-full text-left text-xs font-mono text-violet hover:text-white border border-violet/40 hover:bg-violet/20 rounded-md px-3 py-2 mt-2.5 transition-colors duration-150">
          ⚡ run all 5 in one /v1/troubleshoot/batch call
        </button>
      </div>
    </aside>

    <!-- RIGHT: VITALS + RESULT -->
    <main>
      <!-- VITALS STRIP -->
      <div class="bg-surface border border-line rounded-2xl px-5 py-4 mb-5 grid grid-cols-2 sm:grid-cols-5 gap-x-4 gap-y-3">
        <div class="border-l-2 border-line pl-3" id="vitalLatencyWrap">
          <div class="text-inkdim text-[10px] font-mono uppercase tracking-wider">latency</div>
          <div id="metricLatency" class="text-ink font-mono font-semibold text-base">—</div>
        </div>
        <div class="border-l-2 border-line pl-3" id="vitalCacheWrap">
          <div class="text-inkdim text-[10px] font-mono uppercase tracking-wider">cache</div>
          <div id="metricCache" class="text-ink font-mono font-semibold text-base">—</div>
        </div>
        <div class="border-l-2 border-line pl-3">
          <div class="text-inkdim text-[10px] font-mono uppercase tracking-wider">tokens</div>
          <div id="metricTokens" class="text-ink font-mono font-semibold text-base">—</div>
        </div>
        <div class="border-l-2 border-line pl-3">
          <div class="text-inkdim text-[10px] font-mono uppercase tracking-wider">cost</div>
          <div id="metricCost" class="text-ink font-mono font-semibold text-base">—</div>
        </div>
        <div class="border-l-2 border-line pl-3" id="vitalSchemaWrap">
          <div class="text-inkdim text-[10px] font-mono uppercase tracking-wider">schema</div>
          <div id="metricSchema" class="text-ink font-mono font-semibold text-base">—</div>
        </div>
      </div>

      <!-- RESULT AREA -->
      <div id="resultContainer">
        <div class="bg-surface/60 border border-dashed border-line rounded-2xl py-20 text-center">
          <p class="text-inkdim text-sm font-mono">awaiting input — run a diagnosis to see the scan</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- TELEMETRY / ANALYTICS DRAWER -->
<div id="telemetryDrawer" class="fixed inset-x-0 bottom-0 translate-y-full transition-transform duration-300 ease-out z-40">
  <div class="max-w-7xl mx-auto px-5 lg:px-8">
    <div class="bg-surface2 border border-line border-b-0 rounded-t-2xl p-5 shadow-2xl max-h-[82vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <p class="font-mono text-xs text-inkdim">system_telemetry ── /stats · live, computed from real request/feedback logs</p>
        <button id="closeTelemetry" class="text-inkdim hover:text-ink text-xs font-mono">close ✕</button>
      </div>
      <div id="telemetryBody">
        <div class="text-inkdim text-xs font-mono">loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Shared chart tooltip (single instance, repositioned per hover) -->
<div id="chartTooltip" class="hidden fixed z-50 pointer-events-none bg-void border border-line rounded-lg px-2.5 py-1.5 text-xs font-mono text-ink shadow-xl"></div>

<script>
const API_BASE = 'http://localhost:8000';

const complaintInput = document.getElementById('complaintInput');
const diagnoseBtn = document.getElementById('diagnoseBtn');
const resultContainer = document.getElementById('resultContainer');
const langSelect = document.getElementById('langSelect');
const micBtn = document.getElementById('micBtn');
const micStatus = document.getElementById('micStatus');

// --- Voice input (Web Speech API) ---------------------------------------
// Runs entirely client-side in the browser (Chrome/Edge support this
// natively) -- no backend change needed. The recognised text is dropped
// straight into the same textarea the typed flow uses, so everything
// downstream (cache, LLM/offline pipeline, multi-language handling in
// prompts.py) works unchanged. Falls back to a disabled button with an
// explanation on browsers without SpeechRecognition (e.g. Firefox).
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;

if (!SpeechRecognitionCtor) {
  micBtn.disabled = true;
  micBtn.classList.add('opacity-40', 'cursor-not-allowed');
  micBtn.title = 'Voice input not supported in this browser (try Chrome/Edge)';
} else {
  recognizer = new SpeechRecognitionCtor();
  recognizer.continuous = false;
  recognizer.interimResults = true;

  recognizer.onstart = () => {
    listening = true;
    micBtn.classList.add('text-red', 'border-red/60');
    micStatus.textContent = 'listening…';
  };
  recognizer.onerror = (e) => {
    micStatus.textContent = `mic error: ${e.error}`;
  };
  recognizer.onend = () => {
    listening = false;
    micBtn.classList.remove('text-red', 'border-red/60');
    setTimeout(() => { if (!listening) micStatus.textContent = ''; }, 1500);
  };
  recognizer.onresult = (event) => {
    let transcript = '';
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    complaintInput.value = transcript;
    micStatus.textContent = event.results[event.results.length - 1].isFinal
      ? 'captured — review and run diagnosis'
      : 'listening…';
  };

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognizer.stop();
      return;
    }
    recognizer.lang = langSelect.value;
    try {
      recognizer.start();
    } catch (e) {
      micStatus.textContent = 'could not start mic';
    }
  });
}
const statusDot = document.getElementById('statusDot');
const apiStatusText = document.getElementById('apiStatusText');

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    complaintInput.value = btn.dataset.q;
    runDiagnosis();
  });
});

diagnoseBtn.addEventListener('click', runDiagnosis);
complaintInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    runDiagnosis();
  }
});

const batchDemoBtn = document.getElementById('batchDemoBtn');
batchDemoBtn.addEventListener('click', runBatchDemo);

// Demonstrates POST /v1/troubleshoot/batch live: sends all 5 quick_test
// complaints in a single HTTP round trip instead of 5 separate ones, and
// renders a compact per-item summary (this intentionally does NOT reuse
// renderContexts() -- a batch response is a list of independent pipeline
// results, not one set of Goal contexts, so it gets its own renderer below).
async function runBatchDemo() {
  const items = Array.from(document.querySelectorAll('.preset-btn')).map(b => ({ query: b.dataset.q }));

  batchDemoBtn.disabled = true;
  batchDemoBtn.classList.add('opacity-50');
  resultContainer.innerHTML = `
    <div class="relative bg-surface border border-line rounded-2xl py-16 text-center overflow-hidden">
      <div class="absolute left-0 right-0 h-24 bg-gradient-to-b from-violet/0 via-violet/10 to-violet/0 scan-line"></div>
      <p class="text-violet font-mono text-sm relative">running ${items.length} complaints through /v1/troubleshoot/batch…</p>
    </div>
  `;
  resetMetrics();

  try {
    const res = await fetch(`${API_BASE}/v1/troubleshoot/batch`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items })
    });

    setApiOnline(true);
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Server returned ${res.status}: ${errText}`);
    }

    const data = await res.json();
    renderBatchResults(data, items);

  } catch (err) {
    setApiOnline(false);
    resultContainer.innerHTML = `
      <div class="bg-red/10 border border-red/40 rounded-2xl p-6 fade-up">
        <p class="text-red font-display font-semibold mb-1">Connection lost</p>
        <p class="text-red/70 text-sm">Backend unreachable at ${API_BASE}. Confirm uvicorn is running.</p>
        <p class="text-red/50 text-xs mt-3 font-mono">${escapeHtml(err.message)}</p>
      </div>
    `;
  } finally {
    batchDemoBtn.disabled = false;
    batchDemoBtn.classList.remove('opacity-50');
  }
}

function renderBatchResults(data, items) {
  const rows = (data.results || []).map((r, i) => {
    const query = escapeHtml(items[i]?.query || '');
    if (!r.ok) {
      return `
        <div class="border border-red/30 bg-red/10 rounded-lg px-3 py-2.5">
          <p class="text-ink text-xs font-mono mb-1">${query}</p>
          <p class="text-red text-xs font-mono">✗ error: ${escapeHtml(r.error || '')}</p>
        </div>`;
    }
    const contexts = r.result?.response?.contexts || [];
    const noMatch = contexts.length === 0;
    const actionCount = contexts.reduce((n, c) => n + (c.actions?.length || 0), 0);
    const latency = r.result?.meta?.latency_ms;
    return `
      <div class="border border-line bg-void rounded-lg px-3 py-2.5">
        <p class="text-ink text-xs font-mono mb-1">${query}</p>
        <p class="${noMatch ? 'text-amber' : 'text-cyan'} text-xs font-mono">
          ${noMatch ? '— no match in diagnostic catalog' : `✓ ${contexts.length} goal(s), ${actionCount} action(s)`}
          ${latency != null ? `<span class="text-inkdim">· ${latency}ms</span>` : ''}
        </p>
      </div>`;
  }).join('');

  resultContainer.innerHTML = `
    <div class="fade-up">
      <p class="text-inkdim text-xs font-mono mb-3">
        batch complete — ${data.succeeded}/${data.count} succeeded
        <span class="text-inkdim/70">· request_id ${escapeHtml(data.request_id || '')}</span>
      </p>
      <div class="space-y-2">${rows}</div>
    </div>
  `;
}

async function checkHealth() {
  try {
    const res = await fetch(`${API_BASE}/health`);
    setApiOnline(res.ok);
  } catch (err) {
    setApiOnline(false);
  }
}

function setApiOnline(isOnline) {
  if (isOnline) {
    statusDot.className = 'w-1.5 h-1.5 rounded-full bg-cyan';
    apiStatusText.textContent = 'ONLINE';
    apiStatusText.className = 'text-xs font-mono text-cyan';
  } else {
    statusDot.className = 'w-1.5 h-1.5 rounded-full bg-red';
    apiStatusText.textContent = 'OFFLINE';
    apiStatusText.className = 'text-xs font-mono text-red';
  }
}

async function runDiagnosis() {
  const query = complaintInput.value.trim();
  if (!query) return;

  diagnoseBtn.disabled = true;
  diagnoseBtn.classList.add('opacity-50');

  resultContainer.innerHTML = `
    <div class="relative bg-surface border border-line rounded-2xl py-16 text-center overflow-hidden">
      <div class="absolute left-0 right-0 h-24 bg-gradient-to-b from-violet/0 via-violet/10 to-violet/0 scan-line"></div>
      <p class="text-violet font-mono text-sm relative">scanning — stage 0 enrichment → stage 1 extraction…</p>
    </div>
  `;
  resetMetrics();

  try {
    const res = await fetch(`${API_BASE}/v1/troubleshoot`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });

    setApiOnline(true);
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Server returned ${res.status}: ${errText}`);
    }

    const data = await res.json();
    updateMetrics(data.meta || {});
    renderContexts(data.response?.contexts || [], query);

  } catch (err) {
    setApiOnline(false);
    resultContainer.innerHTML = `
      <div class="bg-red/10 border border-red/40 rounded-2xl p-6 fade-up">
        <p class="text-red font-display font-semibold mb-1">Connection lost</p>
        <p class="text-red/70 text-sm">Backend unreachable at ${API_BASE}. Confirm uvicorn is running.</p>
        <p class="text-red/50 text-xs mt-3 font-mono">${escapeHtml(err.message)}</p>
      </div>
    `;
  } finally {
    diagnoseBtn.disabled = false;
    diagnoseBtn.classList.remove('opacity-50');
  }
}

function resetMetrics() {
  ['metricLatency','metricCache','metricTokens','metricCost','metricSchema'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '—';
    el.className = 'text-ink font-mono font-semibold text-base';
  });
}

function updateMetrics(meta) {
  const latency = meta.latency_ms ?? 0;
  const latencyEl = document.getElementById('metricLatency');
  latencyEl.textContent = `${latency}ms`;
  latencyEl.className = `font-mono font-semibold text-base ${latency < 300 ? 'text-cyan' : 'text-ink'}`;

  const cacheEl = document.getElementById('metricCache');
  if (meta.cache_hit) {
    cacheEl.textContent = 'HIT';
    cacheEl.className = 'font-mono font-semibold text-base text-amber';
  } else {
    cacheEl.textContent = 'MISS';
    cacheEl.className = 'font-mono font-semibold text-base text-inkdim';
  }

  const totalTokens = meta.total_tokens ?? ((meta.prompt_tokens || 0) + (meta.completion_tokens || 0));
  document.getElementById('metricTokens').textContent = totalTokens;

  const cost = meta.cost_usd ?? 0;
  document.getElementById('metricCost').textContent = `$${cost.toFixed(4)}`;

  const schemaEl = document.getElementById('metricSchema');
  const errors = meta.validation_errors || [];
  if (errors.length === 0) {
    schemaEl.textContent = 'PASS';
    schemaEl.className = 'font-mono font-semibold text-base text-cyan';
  } else {
    schemaEl.textContent = `${errors.length} ERR`;
    schemaEl.className = 'font-mono font-semibold text-base text-red';
  }
}

function categoryColor(category) {
  if (category === 'auto') return { dot: 'bg-cyan', text: 'text-cyan', border: 'border-cyan/40', bg: 'bg-cyan/10' };
  if (category === 'critical') return { dot: 'bg-red', text: 'text-red', border: 'border-red/40', bg: 'bg-red/10' };
  return { dot: 'bg-amber', text: 'text-amber', border: 'border-amber/40', bg: 'bg-amber/10' };
}

// Must match feedback.DUMMY_POSITIVE_DEEPLINK / deeplink_matching.DUMMY_POSITIVE_DEEPLINK
// on the backend -- feedback on this placeholder isn't meaningful (no real catalog match).
const DUMMY_DEEPLINK = 'bixby://dummy_positive';

function deeplinkSection(action, query) {
  const category = action.category || 'manual';
  const deeplink = action.stepGroups?.[0]?.actionableDeeplink;

  if (category === 'critical') {
    return `
      <div class="mt-3 bg-red/10 border border-red/30 rounded-lg px-3 py-2.5">
        <p class="text-red text-xs font-mono">⚠ deeplink nullified — destructive step requires manual confirmation</p>
      </div>
    `;
  }
  if (category === 'auto' && deeplink) {
    const isReal = deeplink.deeplink && deeplink.deeplink !== DUMMY_DEEPLINK;
    return `
      <div class="mt-3 bg-void border border-line rounded-lg px-3 py-2.5">
        <p class="text-cyan text-xs font-mono break-all">↳ ${escapeHtml(deeplink.deeplink || '')}</p>
        <p class="text-inkdim text-xs mt-1">${escapeHtml(deeplink.message || deeplink.description || '')}</p>
        ${matchExplanationSection(deeplink.matchExplanation)}
        ${isReal ? feedbackWidget(deeplink.deeplink, action.actionName || '', query) : ''}
      </div>
    `;
  }
  return `<div class="mt-3"><span class="text-inkdim text-xs font-mono">no deeplink — physical action required</span></div>`;
}

// Renders the score breakdown attached by deeplink_matching.py's
// best_match_explained() (BM25/dense components + feedback nudge for the
// hybrid matcher, or a fuzzy-ratio score for the rules matcher), so a judge
// can see *why* this specific screen was picked without reading server logs.
function matchExplanationSection(exp) {
  if (!exp || exp.reason === 'empty_index') return '';

  const rows = [];
  if (exp.matcher === 'hybrid_bm25_dense') {
    rows.push(['bm25', exp.bm25_component]);
    rows.push(['dense', exp.dense_component]);
    rows.push(['feedback', exp.feedback_adjustment >= 0 ? `+${exp.feedback_adjustment}` : exp.feedback_adjustment]);
    rows.push(['final score', exp.final_score]);
  } else if (exp.matcher === 'rules_fuzzy') {
    rows.push(['fuzzy ratio', exp.fuzzy_score]);
    rows.push(['feedback (pts)', exp.feedback_adjustment_pts >= 0 ? `+${exp.feedback_adjustment_pts}` : exp.feedback_adjustment_pts]);
    rows.push(['final score', exp.final_score_pts]);
  }

  const keywords = (exp.matched_keywords || []).map(
    k => `<span class="inline-block bg-violet/10 text-violet border border-violet/30 rounded px-1.5 py-0.5 mr-1 mb-1 font-mono text-[10px]">${escapeHtml(k)}</span>`
  ).join('');

  return `
    <details class="mt-2">
      <summary class="text-inkdim text-[10px] font-mono cursor-pointer hover:text-ink select-none">why this match? (${escapeHtml(exp.matcher || '')})</summary>
      <div class="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5">
        ${rows.map(([label, val]) => `<span class="font-mono text-[10px] text-inkdim">${label}: <span class="text-ink">${escapeHtml(String(val))}</span></span>`).join('')}
      </div>
      ${keywords ? `<div class="mt-1.5">${keywords}</div>` : ''}
    </details>
  `;
}

let _feedbackSeq = 0;

function feedbackWidget(deeplink, actionName, query) {
  const wid = `fb-${++_feedbackSeq}`;
  const payload = { deeplink, actionName, query };
  window[`__fb_${wid}`] = payload;
  return `
    <div id="${wid}" class="mt-2 pt-2 border-t border-line/60 flex items-center gap-2">
      <span class="text-inkdim text-[10px] font-mono uppercase tracking-wider">match helpful?</span>
      <button onclick="submitFeedback('${wid}', true)"
        class="feedback-btn text-xs px-2 py-0.5 rounded border border-line hover:border-cyan hover:text-cyan text-inkdim transition-colors">👍</button>
      <button onclick="submitFeedback('${wid}', false)"
        class="feedback-btn text-xs px-2 py-0.5 rounded border border-line hover:border-red hover:text-red text-inkdim transition-colors">👎</button>
      <span class="feedback-status text-[10px] font-mono text-inkdim"></span>
    </div>
  `;
}

async function submitFeedback(wid, helpful) {
  const el = document.getElementById(wid);
  if (!el) return;
  const payload = window[`__fb_${wid}`];
  el.querySelectorAll('.feedback-btn').forEach(b => b.disabled = true);
  const statusEl = el.querySelector('.feedback-status');
  statusEl.textContent = 'sending…';
  try {
    const res = await fetch(`${API_BASE}/v1/feedback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        deeplink: payload.deeplink,
        action_name: payload.actionName,
        helpful,
        query: payload.query || '',
      }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    statusEl.textContent = helpful
      ? `recorded ✓ (adj ${data.adjustment >= 0 ? '+' : ''}${data.adjustment})`
      : `recorded ✓ (adj ${data.adjustment >= 0 ? '+' : ''}${data.adjustment})`;
    statusEl.className = `feedback-status text-[10px] font-mono ${helpful ? 'text-cyan' : 'text-red'}`;
  } catch (err) {
    statusEl.textContent = 'failed to send';
    el.querySelectorAll('.feedback-btn').forEach(b => b.disabled = false);
  }
}

function radialGauge(pct) {
  const r = 30;
  const circumference = 2 * Math.PI * r;
  const offset = circumference - (pct / 100) * circumference;
  return `
    <svg width="76" height="76" viewBox="0 0 76 76" class="-rotate-90 flex-shrink-0">
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="#212838" stroke-width="6"/>
      <circle cx="38" cy="38" r="${r}" fill="none" stroke="#8B7CFF" stroke-width="6"
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
  `;
}

function renderContexts(contexts, query) {
  if (!contexts || contexts.length === 0) {
    resultContainer.innerHTML = `
      <div class="bg-surface border border-line rounded-2xl p-10 text-center fade-up">
        <p class="text-ink font-display font-semibold mb-1">No match in the diagnostic catalog</p>
        <p class="text-inkdim text-sm">This doesn't map to a known Galaxy fix. Try describing the symptom more specifically.</p>
      </div>
    `;
    return;
  }

  resultContainer.innerHTML = contexts.map(goal => {
    const scorePct = Math.round((goal.score || 0) * 100);
    const actions = goal.actions || [];

    const timelineHtml = actions.map((action, i) => {
      const c = categoryColor(action.category);
      const steps = (action.stepGroups || []).flatMap(sg => sg.steps || []);
      const isLast = i === actions.length - 1;

      return `
        <div class="relative pl-9 ${isLast ? '' : 'pb-6'}">
          ${!isLast ? `<div class="absolute left-[7px] top-4 bottom-0 w-px bg-line"></div>` : ''}
          <div class="absolute left-0 top-1 w-4 h-4 rounded-full ${c.bg} border-2 ${c.border} flex items-center justify-center">
            <span class="w-1.5 h-1.5 rounded-full ${c.dot}"></span>
          </div>
          <div class="bg-surface border border-line rounded-xl px-4 py-3.5">
            <div class="flex items-start justify-between gap-3 mb-1.5">
              <h3 class="font-display font-semibold text-sm text-ink">${escapeHtml(action.actionName || '')}</h3>
              <span class="text-[10px] font-mono uppercase tracking-wider ${c.text} flex-shrink-0 pt-0.5">${escapeHtml(action.category || 'manual')}</span>
            </div>
            <p class="text-inkdim text-xs mb-2.5">${escapeHtml(action.description || '')}</p>
            <ol class="space-y-1">
              ${steps.map(s => `<li class="text-ink/80 text-xs font-mono">· ${escapeHtml(s)}</li>`).join('')}
            </ol>
            ${deeplinkSection(action, query)}
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="bg-surface/40 border border-line rounded-2xl p-5 mb-5 fade-up">
        <div class="flex items-center gap-4 mb-6">
          ${radialGauge(scorePct)}
          <div class="-ml-16 pl-16">
            <p class="text-violet font-mono text-xs mb-1">${scorePct}% confidence</p>
            <h2 class="font-display font-bold text-lg text-white leading-snug">${escapeHtml(goal.goal || goal.title || 'Diagnosis')}</h2>
          </div>
        </div>
        <div>${timelineHtml}</div>
      </div>
    `;
  }).join('');
}

// Telemetry drawer
const telemetryToggle = document.getElementById('telemetryToggle');
const telemetryDrawer = document.getElementById('telemetryDrawer');
const telemetryBody = document.getElementById('telemetryBody');
const closeTelemetry = document.getElementById('closeTelemetry');
let drawerOpen = false;

telemetryToggle.addEventListener('click', async () => {
  drawerOpen = !drawerOpen;
  telemetryDrawer.classList.toggle('translate-y-full', !drawerOpen);
  if (drawerOpen) await loadTelemetry();
});

closeTelemetry.addEventListener('click', () => {
  drawerOpen = false;
  telemetryDrawer.classList.add('translate-y-full');
});

// ---------------------------------------------------------------------------
// Analytics dashboard -- stat tiles + two small inline-SVG charts, all built
// from real /stats output (request_log.jsonl + feedback aggregates), never
// mock data. See dataviz notes inline: single-series bars get one hue (no
// per-category rainbow -- the axis label already carries identity); the
// 2-series feedback bar gets a legend + direct labels since color there
// *does* carry independent meaning (helpful vs unhelpful).
// ---------------------------------------------------------------------------

const tooltip = document.getElementById('chartTooltip');

function showTooltip(evt, html) {
  tooltip.innerHTML = html;
  tooltip.classList.remove('hidden');
  moveTooltip(evt);
}
function moveTooltip(evt) {
  const pad = 14;
  tooltip.style.left = `${evt.clientX + pad}px`;
  tooltip.style.top = `${evt.clientY + pad}px`;
}
function hideTooltip() {
  tooltip.classList.add('hidden');
}

function statTile(label, value, colorClass = 'text-ink') {
  return `
    <div class="bg-void/60 border border-line rounded-xl px-3.5 py-3">
      <div class="text-inkdim text-[10px] font-mono uppercase tracking-wider mb-1">${escapeHtml(label)}</div>
      <div class="${colorClass} font-mono font-semibold text-lg">${value}</div>
    </div>
  `;
}

// Single-series horizontal bar chart. One hue throughout (violet, the app's
// existing "confidence" accent) -- each bar's own row label already
// identifies it, so a per-bar categorical color would encode nothing real.
function domainBarChart(domainCounts) {
  const entries = Object.entries(domainCounts || {}).sort((a, b) => b[1] - a[1]);
  if (entries.length === 0) {
    return `<p class="text-inkdim text-xs font-mono">no requests logged yet</p>`;
  }
  const total = entries.reduce((sum, [, c]) => sum + c, 0);
  const max = Math.max(...entries.map(([, c]) => c));
  const rowH = 26, barMaxW = 100; // percent width of track

  const rows = entries.map(([domain, count], i) => {
    const pct = max > 0 ? (count / max) * barMaxW : 0;
    const share = total > 0 ? Math.round((count / total) * 100) : 0;
    return `
      <div class="flex items-center gap-3" style="height:${rowH}px"
           onmouseenter="showTooltip(event, '<b>${escapeHtml(domain)}</b><br>${count} request${count === 1 ? '' : 's'} (${share}%)')"
           onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">
        <div class="w-20 shrink-0 text-inkdim text-[11px] font-mono truncate">${escapeHtml(domain)}</div>
        <div class="flex-1 bg-void rounded-full h-[10px] relative overflow-hidden">
          <div class="bg-violet h-full rounded-full transition-all" style="width:${pct}%"></div>
        </div>
        <div class="w-8 shrink-0 text-ink text-[11px] font-mono text-right">${count}</div>
      </div>
    `;
  }).join('');

  return `<div class="space-y-1.5">${rows}</div>`;
}

// Two-series stacked bar (helpful vs unhelpful). Color carries real,
// independent meaning here, so it gets a legend + direct segment labels --
// reusing the app's existing status hues (cyan = good, red = critical).
function feedbackBar(feedback) {
  const helpful = feedback?.helpful ?? 0;
  const unhelpful = feedback?.unhelpful ?? 0;
  const total = helpful + unhelpful;
  if (total === 0) {
    return `<p class="text-inkdim text-xs font-mono">no feedback submitted yet -- try the 👍/👎 buttons under a matched deeplink</p>`;
  }
  const helpfulPct = Math.round((helpful / total) * 100);
  const unhelpfulPct = 100 - helpfulPct;

  return `
    <div>
      <div class="flex items-center gap-4 mb-2 text-[11px] font-mono">
        <span class="flex items-center gap-1.5 text-inkdim"><span class="w-2.5 h-2.5 rounded-full bg-cyan inline-block"></span>helpful (${helpful})</span>
        <span class="flex items-center gap-1.5 text-inkdim"><span class="w-2.5 h-2.5 rounded-full bg-red inline-block"></span>unhelpful (${unhelpful})</span>
      </div>
      <div class="flex h-[18px] rounded-full overflow-hidden bg-void">
        ${helpful > 0 ? `<div class="bg-cyan h-full flex items-center justify-center text-void text-[10px] font-mono font-semibold"
             style="width:${helpfulPct}%"
             onmouseenter="showTooltip(event, '${helpful} helpful vote${helpful === 1 ? '' : 's'} (${helpfulPct}%)')"
             onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">${helpfulPct >= 12 ? helpfulPct + '%' : ''}</div>` : ''}
        ${unhelpful > 0 ? `<div class="bg-red h-full flex items-center justify-center text-void text-[10px] font-mono font-semibold"
             style="width:${unhelpfulPct}%"
             onmouseenter="showTooltip(event, '${unhelpful} unhelpful vote${unhelpful === 1 ? '' : 's'} (${unhelpfulPct}%)')"
             onmousemove="moveTooltip(event)" onmouseleave="hideTooltip()">${unhelpfulPct >= 12 ? unhelpfulPct + '%' : ''}</div>` : ''}
      </div>
    </div>
  `;
}

function statsTableView(s) {
  const rows = [
    ['Total requests', s.total_requests ?? 0],
    ['Avg latency', `${s.avg_latency_ms ?? 0}ms`],
    ['P95 latency', `${s.p95_latency_ms ?? 0}ms`],
    ['Cache hit rate', `${Math.round((s.cache_hit_rate || 0) * 100)}%`],
    ['No-match rate', `${Math.round((s.no_match_rate || 0) * 100)}%`],
    ['Total tokens', s.total_tokens ?? 0],
    ['Total cost', `$${(s.total_cost_usd ?? 0).toFixed(4)}`],
    ['Feedback events', s.feedback?.total_feedback_events ?? 0],
    ['Feedback helpful rate', s.feedback?.helpful_rate != null ? `${Math.round(s.feedback.helpful_rate * 100)}%` : '—'],
  ];
  return `
    <table class="w-full text-[11px] font-mono">
      <tbody>
        ${rows.map(([k, v]) => `
          <tr class="border-b border-line/60">
            <td class="py-1.5 text-inkdim">${escapeHtml(k)}</td>
            <td class="py-1.5 text-ink text-right">${escapeHtml(String(v))}</td>
          </tr>`).join('')}
        ${Object.entries(s.requests_by_domain || {}).map(([d, c]) => `
          <tr class="border-b border-line/60">
            <td class="py-1.5 text-inkdim">Requests — ${escapeHtml(d)}</td>
            <td class="py-1.5 text-ink text-right">${c}</td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}

async function loadTelemetry() {
  telemetryBody.innerHTML = `<div class="text-inkdim text-xs font-mono">loading…</div>`;
  try {
    const res = await fetch(`${API_BASE}/stats`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const s = await res.json();
    const cacheRatePct = Math.round((s.cache_hit_rate || 0) * 100);
    const noMatchPct = Math.round((s.no_match_rate || 0) * 100);

    telemetryBody.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        ${statTile('requests served', s.total_requests ?? 0)}
        ${statTile('cache hit rate', cacheRatePct + '%', 'text-amber')}
        ${statTile('no-match rate', noMatchPct + '%', noMatchPct > 30 ? 'text-red' : 'text-ink')}
        ${statTile('p95 latency', (s.p95_latency_ms ?? 0) + 'ms', 'text-cyan')}
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-2">
        <div class="bg-void/40 border border-line rounded-xl p-4">
          <p class="font-mono text-[10px] text-inkdim uppercase tracking-wider mb-3">requests by domain</p>
          ${domainBarChart(s.requests_by_domain)}
        </div>
        <div class="bg-void/40 border border-line rounded-xl p-4">
          <p class="font-mono text-[10px] text-inkdim uppercase tracking-wider mb-3">deeplink match feedback (${s.feedback?.deeplinks_with_feedback ?? 0} deeplinks rated)</p>
          ${feedbackBar(s.feedback)}
        </div>
      </div>

      <details class="mt-1">
        <summary class="text-inkdim text-[11px] font-mono cursor-pointer hover:text-ink select-none">table view (all numbers, screen-reader friendly)</summary>
        <div class="mt-2 bg-void/40 border border-line rounded-xl p-4">
          ${statsTableView(s)}
        </div>
      </details>
    `;
  } catch (err) {
    telemetryBody.innerHTML = `<div class="text-red text-xs font-mono">couldn't reach ${API_BASE}/stats</div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

checkHealth();
</script>
